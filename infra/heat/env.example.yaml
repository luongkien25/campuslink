# Mau core + alarm mac dinh tat; gia tri that chi luu tren A mode 0600.
# Schema/query/rate/auth alarm chua kiem tren cum; khong tu ap update core.
parameters:
  app_image: REPLACE_APP_IMAGE
  app_flavor: campus.app
  key_name: REPLACE_KEY_NAME
  app_network: REPLACE_APP_NETWORK
  app_subnet: REPLACE_APP_SUBNET
  app_security_group: REPLACE_APP_SECURITY_GROUP
