# CampusLink - Heat environment MAU (Nhom 11)
# Chu so huu: TV2. Ban that: env.yaml (bi .gitignore chan), copy tu file nay roi dien gia tri.
# Dung:  openstack stack create -t root.yaml -e env.yaml campus-app
#
# Quy uoc:
#   - Lay ID/ten tu docs/inventory.yaml (H2 tu TV1, H1 tu TV3).
#   - KHONG dat secret (DB password, Redis URI, API key) o day: Heat parameters
#     va output co the bi nguoi co quyen quan tri doc. Co che cap secret cho VM
#     do ASG tao van la van de mo O-03 trong SRS.
#   - Network nen, DB VM, Cinder volume du lieu KHONG thuoc stack nay (xoa stack
#     khong duoc mat du lieu).
#   - Ten tham so ben duoi la de xuat; TV2 doi ten thi sua ca root.yaml va file nay.

resource_registry:
  # Mot "app unit" = VM -> readiness (health 200 + Redis PING co auth) -> WaitCondition -> PoolMember
  CampusLink::AppUnit: app-unit.yaml

parameters:
  # --- Placement (inventory: openstack.nova.availability_zones) ---
  az_a: campus-az-a
  az_b: campus-az-b

  # --- Compute (inventory: openstack.flavors / images / keypairs) ---
  app_flavor: campus.app
  app_image: REPLACE_APP_IMAGE_ID            # image da bake Docker + Shlink digest, khong secret
  key_name: REPLACE_KEYPAIR_NAME             # keypair cua user tao stack

  # --- Network (inventory: network.tenant / security_groups) ---
  app_network: REPLACE_CAMPUS_NET_ID
  app_subnet: REPLACE_CAMPUS_SUBNET_ID
  app_security_group: REPLACE_CAMPUS_APP_SG_ID

  # --- Load balancer (OVN, TCP) ---
  # Neu LB/pool do root.yaml tao thi bo 2 dong nay; neu tao ngoai stack thi dien ID.
  lb_pool: REPLACE_POOL_ID
  app_port: 8080

  # --- Ung dung (H1 tu TV3) ---
  shlink_image: shlinkio/shlink@sha256:REPLACE_REPO_DIGEST   # KHONG dung tag latest/develop
  db_host: 10.20.0.10
  redis_host: 10.20.0.10
  short_domain: REPLACE_SHORT_HOSTNAME       # hostname lab, khong mua domain
  admin_origin: https://REPLACE_ADMIN_HOSTNAME
  readiness_timeout: 180                     # giay; het thoi gian => stack FAIL, khong add member

  # --- Scaling (SRS NFR-05; chi la diem khoi dau, chinh theo so do) ---
  asg_b_min: 1
  asg_b_max: 2
  scale_cooldown: 180                        # giay
  # CPU metric cua Gnocchi la nanosecond CPU tich luy, KHONG phai %.
  # Alarm dung aggregation_method rate:mean: Gnocchi lay hieu 2 mau lien nhau (khong chia cho giay),
  # nen moi diem la so ns CPU dung TRONG MOT KHOANG granularity, khong phai ns/s.
  # Nguong = % / 100 x granularity (giay) x 1e9 x so vCPU cua flavor.
  # campus.app 1 vCPU, granularity 60: 60% = 36000000000; 25% = 15000000000.
  # (Ban truoc ghi 600000000 = 60% tinh theo ns/s, tuc chi ~1% o granularity 60 -> alarm luon ALARM.)
  # Doi flavor/granularity thi tinh lai. Kiem % that khi TV4 chay tai:
  #   openstack metric aggregates --resource-type instance --granularity 60 \
  #     '(* (/ (aggregate rate:mean (metric cpu mean)) 60000000000) 100)' 'server_group=campuslink-app'
  cpu_high_threshold: 36000000000
  cpu_low_threshold: 15000000000
  # Can archive policy ceilometer-high-rate (co rate:mean o 60 giay); mac dinh DevStack ceilometer-low
  # chi co 300 giay. TV1 dat GNOCCHI_ARCHIVE_POLICY trong A.local.conf.example.
  alarm_granularity: 60                      # phai khop archive policy Gnocchi
  scale_out_evaluation_periods: 2
  scale_in_evaluation_periods: 3
  metric_group_metadata: campuslink-app      # metadata gan cho VM app de query dung nhom
  # VM app phai co metadata KHOA "metering.server_group" = gia tri tren (Ceilometer chi chep khoa
  # co tien to "metering." vao Gnocchi, thanh thuoc tinh server_group cua resource instance).
  # Alarm: resource_type instance, query '{"=": {"server_group": "campuslink-app"}}'.
