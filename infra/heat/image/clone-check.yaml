heat_template_version: '2021-04-16'
description: >-
  Mot clone private tu image app candidate. Nova ACTIVE khong phai ready.
  Kiem clone A ready/migrate xong truoc khi tao clone B. Khong LB/ASG/DB volume.
parameters:
  image: {type: string}
  flavor: {type: string, default: campus.app}
  key_name: {type: string}
  network: {type: string}
  subnet: {type: string}
  security_groups: {type: comma_delimited_list}
  availability_zone:
    type: string
    constraints:
      - allowed_values: [campus-az-a, campus-az-b]
  bootstrap_credential_id:
    type: string
    hidden: true
    constraints:
      - allowed_pattern: '[a-fA-F0-9]{32}'
  bootstrap_credential_secret:
    type: string
    hidden: true
    constraints:
      - allowed_pattern: '[A-Za-z0-9_+/=-]{16,256}'
resources:
  port:
    type: OS::Neutron::Port
    properties:
      network: {get_param: network}
      fixed_ips:
        - subnet: {get_param: subnet}
      security_groups: {get_param: security_groups}
  config:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        write_files:
          - path: /etc/campuslink/bootstrap.json
            owner: root:root
            permissions: '0600'
            content:
              str_replace:
                template: |
                  {"keystone_url":"http://10.11.0.10/identity/v3/auth/tokens","swift_account_url":"http://10.11.0.10:8080/v1/AUTH_07af3a3dd4c24d1ba028efcb6d28ef84","credential_id":"BOOT_ID","credential_secret":"BOOT_SECRET"}
                params:
                  BOOT_ID: {get_param: bootstrap_credential_id}
                  BOOT_SECRET: {get_param: bootstrap_credential_secret}
        runcmd:
          - [systemctl, start, campuslink-ready.service]
  server:
    type: OS::Nova::Server
    properties:
      image: {get_param: image}
      flavor: {get_param: flavor}
      key_name: {get_param: key_name}
      availability_zone: {get_param: availability_zone}
      networks:
        - port: {get_resource: port}
      metadata:
        campuslink.purpose: app-image-clone
      user_data_format: SOFTWARE_CONFIG
      user_data: {get_resource: config}
outputs:
  server_id: {value: {get_resource: server}}
  address: {value: {get_attr: [port, fixed_ips, 0, ip_address]}}
