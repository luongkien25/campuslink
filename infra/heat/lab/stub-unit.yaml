heat_template_version: '2021-04-16'
description: >-
  VM HTTP stub va member TCP. Cloud-init khoi dong service sau VM ACTIVE;
  day khong phai readiness gate cua Shlink.

parameters:
  image: {type: string}
  flavor: {type: string}
  key_name: {type: string}
  network: {type: string}
  subnet: {type: string}
  security_group: {type: string}
  availability_zone: {type: string}
  backend:
    type: string
    constraints:
      - allowed_pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
  pool: {type: string}
  portal_backend:
    type: string
    constraints:
      - allowed_pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
  portal_pool: {type: string}

resources:
  port:
    type: OS::Neutron::Port
    properties:
      network: {get_param: network}
      fixed_ips:
        - subnet: {get_param: subnet}
      security_groups:
        - {get_param: security_group}
  config:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        write_files:
          - path: /opt/campuslink/stub.py
            owner: root:root
            permissions: '0644'
            content: {get_file: stub.py}
          - path: /etc/systemd/system/campuslink-stub.service
            owner: root:root
            permissions: '0644'
            content:
              str_replace:
                template: |
                  [Unit]
                  Description=CampusLink HTTP stub
                  After=network.target

                  [Service]
                  ExecStart=/usr/bin/python3 /opt/campuslink/stub.py --backend BACKEND --port 8080
                  DynamicUser=yes
                  Restart=on-failure
                  RestartSec=2
                  NoNewPrivileges=yes
                  ProtectSystem=strict
                  ProtectHome=yes

                  [Install]
                  WantedBy=multi-user.target
                params:
                  BACKEND: {get_param: backend}
          - path: /etc/systemd/system/campuslink-portal-stub.service
            owner: root:root
            permissions: '0644'
            content:
              str_replace:
                template: |
                  [Unit]
                  Description=CampusLink portal HTTP stub
                  After=network.target

                  [Service]
                  ExecStart=/usr/bin/python3 /opt/campuslink/stub.py --backend BACKEND --port 8081
                  DynamicUser=yes
                  Restart=on-failure
                  RestartSec=2
                  NoNewPrivileges=yes
                  ProtectSystem=strict
                  ProtectHome=yes

                  [Install]
                  WantedBy=multi-user.target
                params:
                  BACKEND: {get_param: portal_backend}
        runcmd:
          - [systemctl, daemon-reload]
          - [systemctl, enable, --now, campuslink-stub.service]
          - [systemctl, enable, --now, campuslink-portal-stub.service]
  server:
    type: OS::Nova::Server
    properties:
      image: {get_param: image}
      flavor: {get_param: flavor}
      key_name: {get_param: key_name}
      availability_zone: {get_param: availability_zone}
      networks:
        - port: {get_resource: port}
      metadata:
        campuslink.purpose: lb-stub
      user_data_format: SOFTWARE_CONFIG
      user_data: {get_resource: config}
  member:
    type: OS::Octavia::PoolMember
    depends_on: server
    properties:
      pool: {get_param: pool}
      address: {get_attr: [port, fixed_ips, 0, ip_address]}
      subnet: {get_param: subnet}
      protocol_port: 8080
  portal_member:
    type: OS::Octavia::PoolMember
    depends_on: member
    properties:
      pool: {get_param: portal_pool}
      address: {get_attr: [port, fixed_ips, 0, ip_address]}
      subnet: {get_param: subnet}
      protocol_port: 8081

outputs:
  server_id:
    value: {get_resource: server}
  address:
    value: {get_attr: [port, fixed_ips, 0, ip_address]}
  member_id:
    value: {get_resource: member}
  portal_member_id:
    value: {get_resource: portal_member}
