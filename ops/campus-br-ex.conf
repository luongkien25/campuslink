# /etc/systemd/system/campus-nat.service.d/br-ex.conf - chay campus-br-ex ngay sau campus-nat (FR-INF-19, 09 M.3)
# Cai tren A (user ubuntu), tu thu muc repo:
#   sudo install -m 0750 ops/campus-br-ex /usr/local/sbin/campus-br-ex
#   sudo install -d /etc/systemd/system/campus-nat.service.d
#   sudo install -m 0644 ops/campus-br-ex.conf /etc/systemd/system/campus-nat.service.d/br-ex.conf
#   sudo systemctl daemon-reload
# Kiem khong can reboot (mang ao mat IP 1-2 giay):
#   sudo ip address del 172.24.4.1/24 dev br-ex; sudo systemctl restart campus-nat; ip -br addr show br-ex
[Service]
ExecStartPost=/usr/local/sbin/campus-br-ex
