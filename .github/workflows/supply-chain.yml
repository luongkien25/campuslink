# FR-INF-23 (SRS 1.4), ban nhe: quet secret va quet image Shlink; build/SBOM/ky cosign cho
# campus-portal va campus-stats se them khi co Dockerfile (TV3, TV4). Digest Shlink chi quet va bao cao (khong chan).
# Action ghim theo commit SHA (ghi phien ban trong chu thich); gitleaks chay bang image ghim tag.
name: supply-chain

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (toan bo lich su Git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Quet secret (che gia tri khi in)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json
      - name: Luu bao cao (da che gia tri)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  trivy-shlink:
    name: Trivy va SBOM cho digest Shlink (chi bao cao)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Doc digest Shlink tu docs/versions.lock
        id: dg
        run: |
          ref=$(grep -E '^shlink_image_digest=' docs/versions.lock | sed -E 's/^shlink_image_digest=([^ ]+).*/\1/')
          case "$ref" in
            shlinkio/shlink@sha256:*) ;;
            *) echo "digest khong hop le: $ref"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Digest quet: $ref"
      - name: Trivy (CRITICAL, HIGH co ban va), bao cao dang bang
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.dg.outputs.ref }}
          format: table
          output: trivy-shlink.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.dg.outputs.ref }}
          format: cyclonedx
          output: sbom-shlink.cdx.json
          exit-code: '0'
      - name: Tom tat vao trang chay
        if: always()
        run: |
          {
            echo "### Trivy: ${{ steps.dg.outputs.ref }}"
            echo
            echo '```'
            head -n 80 trivy-shlink.txt 2>/dev/null || echo "(chua co bao cao)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Luu bao cao va SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-shlink
          path: |
            trivy-shlink.txt
            sbom-shlink.cdx.json
          if-no-files-found: ignore
