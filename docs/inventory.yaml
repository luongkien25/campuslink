    # rieng cua tung thanh vien can SSH; khong mo 0.0.0.0/0, khong dung chung .pem.

openstack:
  release: stable/2026.1
  devstack_sha: "REPLACE"       # cung SHA tren A va B
  gnocchi_sha: "REPLACE"        # TV2 chot
  repo_shas_file: docs/versions.lock
  keystone_auth_url: "http://10.11.0.10/identity"   # doc lai tu catalog
  nova:
    host_a: "REPLACE"           # cot Host cua compute service list
    host_b: "REPLACE"
    aggregates:
      campus-agg-a: { az: campus-az-a, host: host_a }
      campus-agg-b: { az: campus-az-b, host: host_b }
  networks:
    external: { name: public, cidr: 172.24.4.0/24, br_ex_ip: 172.24.4.1, fip_pool: "172.24.4.100-172.24.4.200" }
    devstack_demo: { cidr: 10.21.0.0/24 }
    campus_net: { cidr: 10.20.0.0/24, gateway: 10.20.0.1, pool: "10.20.0.100-10.20.0.220", mtu: 1400, id: "REPLACE", subnet_id: "REPLACE" }
    campus_router: { id: "REPLACE" }
  security_groups:
    campus-app-sg:  { id: "REPLACE" }
    campus-db-sg:   { id: "REPLACE" }    # 5432 + 6379 tu app SG
    campus-diag-sg: { id: "REPLACE" }    # tam thoi
  project:
    name: campuslink
    id: "REPLACE"
    users: { campus-tv2: member, campus-tv3: member, campus-tv4: reader }
    quota: { instances: 6, cores: 8, ram_mib: 12288, volumes: 5, gigabytes: 30, floating_ips: 3 }
  flavors:
    campus.app:     { vcpus: 1, ram_mib: 2048, disk_gib: 10 }
    campus.db:      { vcpus: 1, ram_mib: 2048, disk_gib: 10 }
    campus.builder: { vcpus: 2, ram_mib: 4096, disk_gib: 20 }
  images:
    ubuntu-noble-base: { id: "REPLACE", source_url: "REPLACE", sha256: "REPLACE", date: "REPLACE" }
  storage:
    cinder_vg: stack-volumes-lvmdriver-1
    cinder_target: "REPLACE"    # target_helper/target_protocol doc tu cinder.conf
    db_port: { ip: 10.20.0.10, id: "REPLACE" }
    db_volume: { name: campus-db-data, size_gib: 10, id: "REPLACE", type: "REPLACE", az: "REPLACE" }
    swift:
      container: campus-backups
      disk_image: /opt/stack/data/swift/drives/images/swift.img
      mountpoint: /opt/stack/data/swift/drives/sdb1
      loopback_size: 5G

