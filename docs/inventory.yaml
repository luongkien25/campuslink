aws:
  region: us-east-1
  account_alias: "REPLACE"
  account_type: "tai khoan thuong, Paid plan, dang nhap root"   # 22/10/2026
  caller_arn_redacted: "arn:aws:iam::<ACCOUNT_ID>:root"
  quota_on_demand_standard_vcpu: "16 (dang dung 0)"   # can >= 12 kha dung; 22/10/2026
  credit_balance_usd_checked: "131.38 (kiem 22/10/2026, han khoang 1 nam)"
  budget_alerts_usd: [30, 50, 65]
  nested_virtualization_supported:
    m7i.2xlarge: "yes"          # describe-instance-types 22/10/2026
    m7i.xlarge: "yes"
  availability_zones:
    az_a: { name: "us-east-1a", id: "use1-az1" }   # ghi ca AZ ID (vd use1-azX)
    az_b: { name: "us-east-1b", id: "use1-az2" }
  vpc:
    name: campus-vpc
    cidr: 10.11.0.0/16
    id: "vpc-0730a24c74eb94b62"
    igw_id: "igw-0ceda12a7ab10f8da"
  subnets:
    public_a:  { cidr: 10.11.0.0/24,  az: az_a, id: "subnet-00c7d6d73205f3cae" }
    private_a: { cidr: 10.11.10.0/24, az: az_a, id: "subnet-0402e50e0be29f05a" }   # du phong
    public_b:  { cidr: 10.11.1.0/24,  az: az_b, id: "subnet-0b9c94d9e201710f0" }   # du phong
    private_b: { cidr: 10.11.11.0/24, az: az_b, id: "subnet-06036244a1d16cab1" }
  route_tables:
    campus_public_rt:  { id: "rtb-082ab7fbd85ef92be", default: "igw" }
    campus_private_rt: { id: "rtb-07baedadc611749be", default: "eni of A" }   # hien chi co local
  security_groups:
    campus_hosts:         { id: "sg-096f3c77665c4e038" }
    campus_ingress_admin: { id: "sg-0bf8503bfeee5a3c0" }
  ami:
    name: "Ubuntu Server 24.04 LTS amd64 (Canonical)"
    id: "REPLACE"
    owner: "REPLACE"
  hosts:
    A:
      name: campus-a
      type: m7i.2xlarge
      instance_id: "REPLACE"
      eni_id: "REPLACE"
      private_ip: 10.11.0.10
      eip: "REPLACE"
      eip_allocation_id: "REPLACE"
      source_dest_check: false
      nested_virtualization: enabled
      imds: { tokens: required, hop_limit: 1 }
      iam_instance_profile: CampusLinkBackup      # gan o Lab 10
      volumes:
        root:   { size_gib: 60, type: gp3, id: "REPLACE" }
        cinder: { size_gib: 30, type: gp3, id: "REPLACE", nvme_serial: "REPLACE", delete_on_termination: false }
    B:
      name: campus-b
      type: m7i.xlarge
      instance_id: "REPLACE"
      eni_id: "REPLACE"
      private_ip: 10.11.11.10
      public_ipv4: none
      nested_virtualization: enabled
      imds: { tokens: required, hop_limit: 1 }
      volumes:
        root: { size_gib: 60, type: gp3, id: "REPLACE" }
