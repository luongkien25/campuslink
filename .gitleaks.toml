# gitleaks: giu bo luat mac dinh, chi them ngoai le HEP da kiem la khong phai secret (SRS 1.4 FR-INF-23, PR #36).
# Moi ngoai le can ca duong dan lan dang dong (condition = AND) de secret that o cho khac van bi bat.
title = "campuslink"

[extend]
useDefault = true

[[allowlists]]
description = "manifest image TV2: dong 'ten-file: sha256' (ten co chu secrets, gia tri la hash 64 hex, khong phai secret)"
condition = "AND"
paths = ['''evidence/G4/.*image-manifest.*\.json$''']
regexTarget = "line"
regexes = ['''"[A-Za-z0-9_.-]+": "[0-9a-f]{64}"''']

[[allowlists]]
description = "evidence H1 TV2: dong liet ke TEN file api_key_tv2-*, khong chua gia tri (dong truoc ghi ro khong in gia tri)"
condition = "AND"
paths = ['''evidence/G3/20261107-H1-tv2-smoke-local\.txt$''']
regexTarget = "line"
regexes = ['''Ten file: api_key_''']
